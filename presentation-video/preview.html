<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welvar Taste Craft - Presentation Video Preview (Light Theme)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #0F172A;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .player-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 100%;
    }
    .video-viewport {
      width: 1280px;
      height: 720px;
      background: #FAFBFB;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    .canvas-root {
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      transform: scale(0.666667);
      position: absolute;
      top: 0;
      left: 0;
      background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F4F5F7 100%);
      overflow: hidden;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(30, 41, 59, 0.9);
      padding: 12px 24px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      backdrop-filter: blur(8px);
    }
    .btn {
      background: #10B981;
      border: none;
      color: white;
      padding: 8px 18px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .progress-bar {
      width: 420px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #10B981;
      border-radius: 3px;
    }
    .time-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #94A3B8;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-ok {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .badge-info {
      background: rgba(37, 99, 235, 0.1);
      color: #2563EB;
      border: 1px solid rgba(37, 99, 235, 0.25);
    }
    .badge-warn {
      background: rgba(217, 119, 6, 0.1);
      color: #D97706;
      border: 1px solid rgba(217, 119, 6, 0.25);
    }
    .scene-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <div class="video-viewport">
      <div id="canvasRoot" class="canvas-root">
        <!-- Scenes rendered by JavaScript in exact frame sync -->
      </div>
    </div>

    <div class="controls">
      <button id="playBtn" class="btn">Play [Space]</button>
      <div id="progressTrack" class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="timeLabel" class="time-label">00:00 / 00:26</div>
      <span id="sceneBadge" class="badge badge-info">Scene 1: Hook</span>
    </div>
  </div>

  <audio id="soundtrack" src="./public/audio/soundtrack.wav" preload="auto"></audio>

  <script>
    const DURATION = 26.65;
    const TOTAL_FRAMES = 800;
    const FPS = 30;

    const audio = document.getElementById('soundtrack');
    const playBtn = document.getElementById('playBtn');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeLabel = document.getElementById('timeLabel');
    const sceneBadge = document.getElementById('sceneBadge');
    const canvas = document.getElementById('canvasRoot');

    let isPlaying = false;
    let currentFrame = 0;
    let animationFrameId = null;

    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function play() {
      isPlaying = true;
      playBtn.textContent = 'Pause';
      audio.play().catch(() => {});
      loop();
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = 'Play';
      audio.pause();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function seek(time) {
      audio.currentTime = Math.max(0, Math.min(DURATION, time));
      currentFrame = Math.floor(audio.currentTime * FPS);
      render(currentFrame);
    }

    progressTrack.addEventListener('click', (e) => {
      const rect = progressTrack.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      seek(pct * DURATION);
    });

    playBtn.addEventListener('click', togglePlay);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
    });

    audio.addEventListener('ended', () => {
      pause();
      seek(0);
    });

    function loop() {
      if (!isPlaying) return;
      currentFrame = Math.floor(audio.currentTime * FPS);
      if (currentFrame >= TOTAL_FRAMES) {
        pause();
        return;
      }
      render(currentFrame);
      animationFrameId = requestAnimationFrame(loop);
    }

    function render(f) {
      const pct = (f / TOTAL_FRAMES) * 100;
      progressFill.style.width = pct + '%';
      timeLabel.textContent = `${formatTime(f / FPS)} / ${formatTime(DURATION)}`;

      // Determine active scene
      if (f < 115) {
        renderScene1(f);
        sceneBadge.textContent = 'Scene 1: Hook';
      } else if (f < 191) {
        renderScene2(f - 115);
        sceneBadge.textContent = 'Scene 2: Input';
      } else if (f < 345) {
        renderScene3(f - 191);
        sceneBadge.textContent = 'Scene 3: Directives';
      } else if (f < 460) {
        renderScene4(f - 345);
        sceneBadge.textContent = 'Scene 4: 3D Showcase';
      } else if (f < 575) {
        renderScene5(f - 460);
        sceneBadge.textContent = 'Scene 5: Archetypes';
      } else if (f < 690) {
        renderScene6(f - 575);
        sceneBadge.textContent = 'Scene 6: Studio Display';
      } else {
        renderScene7(f - 690);
        sceneBadge.textContent = 'Scene 7: Outro Punch';
      }
    }

    // SCENE 1: HOOK
    function renderScene1(f) {
      let content = '';
      if (f < 38) {
        const op = Math.min(1, f / 12);
        const ty = Math.max(0, 20 - (f / 12) * 20);
        content = `<div style="opacity:${op}; transform:translateY(${ty}px); font-size:68px; font-weight:600; color:#0F172A; letter-spacing:-0.03em;">AI code looks great.</div>`;
      } else if (f < 77) {
        const op = Math.min(1, (f - 38) / 10);
        content = `<div style="opacity:${op}; font-size:68px; font-weight:600; color:#0F172A; letter-spacing:-0.03em;">AI design is <span style="color:#DC2626; font-weight:800; text-decoration:underline;">slop.</span></div>`;
      } else {
        const op = Math.min(1, (f - 77) / 10);
        const sc = 0.96 + ((f - 77) / 38) * 0.06;
        content = `
          <div style="opacity:${op}; transform:scale(${sc}); text-align:center;">
            <div style="font-family:'Playfair Display',serif; font-size:104px; font-weight:700; color:#0F172A; line-height:1.05; margin-bottom:12px;">Taste Craft</div>
            <div style="font-size:34px; color:#475569; font-weight:400;">makes it human.</div>
          </div>
        `;
      }
      canvas.innerHTML = `<div class="scene-container">${content}</div>`;
    }

    // SCENE 2: PROMPT
    function renderScene2(f) {
      const full = "Architect authentic enterprise platform without AI-slop";
      const charCount = Math.min(full.length, Math.floor(Math.max(0, (f - 10) / 44) * full.length));
      const text = full.slice(0, charCount);
      const isClick = f >= 58 && f <= 66;

      const cursorX = 650 + Math.min(1, Math.max(0, (f - 40) / 18)) * 680;
      const cursorY = 800 - Math.min(1, Math.max(0, (f - 40) / 18)) * 260;

      canvas.innerHTML = `
        <div class="scene-container">
          <div style="width:920px; background:#FFFFFF; border-radius:22px; padding:32px 36px 28px; box-shadow:0 25px 50px -12px rgba(15,23,42,0.12); border:1px solid rgba(15,23,42,0.08); display:flex; flex-direction:column; gap:28px; position:relative;">
            <div style="font-size:27px; font-weight:500; color:#0F172A; min-height:52px; display:flex; align-items:center;">
              <span>${text}</span>
              <span style="display:inline-block; width:2px; height:32px; background:#0F172A; margin-left:4px;"></span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(15,23,42,0.08); padding-top:16px;">
              <div style="display:flex; gap:12px; align-items:center;">
                <div style="width:40px; height:40px; border-radius:50%; background:#F1F5F9; border:1px solid rgba(15,23,42,0.08); display:flex; align-items:center; justify-content:center; font-size:20px; color:#475569;">+</div>
                <div style="padding:8px 16px; border-radius:9999px; background:#F1F5F9; border:1px solid rgba(15,23,42,0.08); font-size:14px; font-weight:600; color:#475569;">Archetype: Modern Swiss</div>
                <div class="badge badge-ok">105 Benchmarks</div>
              </div>
              <div style="position:relative;">
                ${isClick ? '<div style="position:absolute; inset:-10px; border-radius:50%; background:#10B981; opacity:0.3; transform:scale(1.8);"></div>' : ''}
                <div style="width:52px; height:52px; border-radius:50%; background:#10B981; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(16,185,129,0.4); transform:scale(${isClick ? 0.9 : 1});">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
              </div>
            </div>
          </div>
          <!-- Cursor -->
          <div style="position:absolute; left:${cursorX}px; top:${cursorY}px; pointer-events:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2));">
            <svg width="28" height="32" viewBox="0 0 24 28" fill="none"><path d="M3 2L10.5 24L14.2 14.8L23 12L3 2Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.8"/></svg>
          </div>
        </div>
      `;
    }

    // SCENE 3: DIRECTIVES PIPELINE
    function renderScene3(f) {
      const t1 = f >= 20;
      const t2 = f >= 40;
      const t3 = f >= 60;
      const t4 = f >= 80;
      const scrollY = f >= 95 ? -((f - 95) / 50) * 300 : 0;

      function item(title, done, strike) {
        return `
          <div style="display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:12px; background:${done ? 'rgba(16,185,129,0.06)' : '#F8FAFC'}; border:1px solid ${done ? 'rgba(16,185,129,0.25)' : 'rgba(15,23,42,0.08)'};">
            <div style="width:22px; height:22px; border-radius:6px; background:${done ? '#10B981' : '#CBD5E1'}; display:flex; align-items:center; justify-content:center;">
              ${done ? '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7L5.8 10L11 4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/></svg>' : ''}
            </div>
            <span style="font-size:15px; font-weight:500; ${done && strike ? 'text-decoration:line-through; opacity:0.7;' : ''}">${title}</span>
          </div>
        `;
      }

      canvas.innerHTML = `
        <div class="scene-container">
          <div style="width:820px; background:#FFFFFF; border-radius:24px; padding:36px; box-shadow:0 25px 50px -12px rgba(15,23,42,0.12); border:1px solid rgba(15,23,42,0.08); max-height:740px; overflow:hidden;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
              <div style="display:flex; gap:12px; align-items:center;">
                <span style="font-size:22px; font-weight:700; color:#0F172A;">System Directives Pipeline</span>
                <span class="badge badge-info">105 Benchmarks</span>
              </div>
              <span class="badge ${t4 ? 'badge-ok' : 'badge-warn'}">${t4 ? 'All Passed [OK]' : 'Compiling...'}</span>
            </div>
            <div style="background:#F5F3FF; border:1px solid #DDD6FE; border-radius:14px; padding:16px 20px; margin-bottom:24px;">
              <div style="font-size:15px; font-weight:600; color:#6D28D9;">Senior Human Web Architecture v9.0 Enforced</div>
              <div style="font-size:13px; color:#7C3AED; margin-top:2px;">Built on 105 world-class websites (Apple, Stripe, Wise, Notion, Vercel).</div>
            </div>
            <div style="transform:translateY(${scrollY}px); display:flex; flex-direction:column; gap:12px;">
              <div style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:#475569; margin-bottom:4px;">PHASE 1: FOUNDATION & PRECISION</div>
              ${item('1. Eradicate purple neon glows & 24px bubble cards', t1, true)}
              ${item('2. Lock 1px hairline precision & 8px spatial grid', t2, false)}
              ${item('3. Inject fluid golden ratio typography scale', t3, false)}
              ${item('4. Verify Cyrillic + Latin optical tracking', t4, false)}
              <div style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:#475569; margin-top:16px; margin-bottom:4px;">PHASE 2: 7 INTENT-DRIVEN ARCHETYPES</div>
              ${item('1. Modern Swiss (Vercel, Linear)', false, false)}
              ${item('2. High-End FinTech (Stripe, Ramp)', false, false)}
            </div>
          </div>
        </div>
      `;
    }

    // SCENE 4: 3D SHOWCASE
    function renderScene4(f) {
      const rotX = 10 - (f / 115) * 4;
      const rotY = -8 + (f / 115) * 4;
      const slider = 20 + Math.min(65, (f / 70) * 65);

      canvas.innerHTML = `
        <div class="scene-container" style="perspective:1400px;">
          <div style="width:1320px; height:780px; background:#FFFFFF; border-radius:20px; box-shadow:0 30px 70px -15px rgba(15,23,42,0.16); border:1px solid rgba(15,23,42,0.08); transform:rotateX(${rotX}deg) rotateY(${rotY}deg); display:flex; flex-direction:column; overflow:hidden;">
            <!-- Nav -->
            <div style="height:64px; padding:0 32px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(15,23,42,0.08);">
              <div style="display:flex; align-items:center; gap:14px;">
                <div style="width:30px; height:30px; background:#0F172A; border-radius:8px; color:white; display:flex; align-items:center; justify-content:center; font-weight:800;">W</div>
                <span style="font-size:18px; font-weight:700;">Welvar Taste Craft</span>
                <span class="badge badge-info">Modern Swiss</span>
              </div>
              <div style="display:flex; gap:24px; font-size:14px; font-weight:500; color:#475569;">
                <span>Manifesto</span>
                <span style="color:#0F172A; font-weight:700;">7 Archetypes</span>
                <span>105 Benchmarks</span>
                <span>Tokens CSS</span>
              </div>
              <button class="btn" style="background:#0F172A;">Deploy Architecture</button>
            </div>
            <!-- Body -->
            <div style="flex:1; padding:36px; background:#F8FAFC; display:flex; flex-direction:column; gap:24px;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <div style="font-size:36px; font-weight:700; letter-spacing:-0.03em;">Human Craft. Zero AI-Slop.</div>
                  <div style="font-size:16px; color:#475569; margin-top:6px;">Engineered with 105 world-class digital benchmarks. Asymmetrical rhythm & 1px hairlines.</div>
                </div>
                <div style="display:flex; gap:12px;">
                  <div style="background:#FFF; padding:12px 20px; border-radius:12px; border:1px solid rgba(15,23,42,0.08);">
                    <div style="font-family:'JetBrains Mono'; font-size:11px; color:#94A3B8;">WCAG AAA CONTRAST</div>
                    <div style="font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:#059669;">7.4 : 1 [PASS]</div>
                  </div>
                  <div style="background:#FFF; padding:12px 20px; border-radius:12px; border:1px solid rgba(15,23,42,0.08);">
                    <div style="font-family:'JetBrains Mono'; font-size:11px; color:#94A3B8;">RADII PRECISION</div>
                    <div style="font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:#0F172A;">4px - 8px</div>
                  </div>
                </div>
              </div>
              <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:24px; flex:1;">
                <div style="background:#FFF; border-radius:14px; padding:24px; border:1px solid rgba(15,23,42,0.08); box-shadow:0 10px 30px -5px rgba(15,23,42,0.06);">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <span style="font-size:16px; font-weight:600;">Living Hero Sandbox: Spatial Density</span>
                    <span class="badge badge-ok">Interactive [OK]</span>
                  </div>
                  <div style="height:8px; border-radius:4px; background:#E2E8F0; overflow:hidden; position:relative; margin-top:12px;">
                    <div style="position:absolute; left:0; top:0; bottom:0; width:${slider}%; background:#10B981;"></div>
                  </div>
                  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:20px;">
                    <div style="background:#F8FAFC; padding:12px; border-radius:8px; border:1px solid rgba(15,23,42,0.08);">
                      <div style="font-size:11px; font-family:'JetBrains Mono'; color:#94A3B8;">LATENCY</div>
                      <div style="font-size:18px; font-family:'JetBrains Mono'; font-weight:700;">1.2 ms</div>
                    </div>
                    <div style="background:#F8FAFC; padding:12px; border-radius:8px; border:1px solid rgba(15,23,42,0.08);">
                      <div style="font-size:11px; font-family:'JetBrains Mono'; color:#94A3B8;">COMPOSITION</div>
                      <div style="font-size:18px; font-family:'JetBrains Mono'; font-weight:700; color:#059669;">Asymmetric</div>
                    </div>
                    <div style="background:#F8FAFC; padding:12px; border-radius:8px; border:1px solid rgba(15,23,42,0.08);">
                      <div style="font-size:11px; font-family:'JetBrains Mono'; color:#94A3B8;">AI SLOP</div>
                      <div style="font-size:18px; font-family:'JetBrains Mono'; font-weight:700; color:#DC2626;">0.0%</div>
                    </div>
                  </div>
                </div>
                <div style="background:#0F172A; border-radius:14px; padding:24px; color:#CBD5E1; font-family:'JetBrains Mono'; font-size:13px; line-height:1.7;">
                  <div style="color:#94A3B8; margin-bottom:8px; display:flex; justify-content:space-between;"><span>tokens.css (Modern Swiss)</span><span style="color:#10B981;">[COMPILED]</span></div>
                  <div><span style="color:#F43F5E;">--radius-card</span>: <span style="color:#38BDF8;">4px</span>;</div>
                  <div><span style="color:#F43F5E;">--hairline</span>: <span style="color:#38BDF8;">1px solid rgba(15,23,42,0.08)</span>;</div>
                  <div><span style="color:#F43F5E;">--font-display</span>: <span style="color:#A7F3D0;">'Plus Jakarta Sans'</span>;</div>
                  <div><span style="color:#F43F5E;">--tracking-hero</span>: <span style="color:#38BDF8;">-0.035em</span>;</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // SCENE 5: ARCHETYPES SWITCHER
    function renderScene5(f) {
      let active = 0;
      if (f >= 35 && f < 75) active = 1;
      else if (f >= 75) active = 2;

      const tabs = [
        { name: 'Modern Swiss', brand: 'Vercel, Linear', r: '4px' },
        { name: 'High-End FinTech', brand: 'Stripe, Ramp', r: '10px' },
        { name: 'Warm Humanist', brand: 'Notion, Stripe Press', r: '12px' }
      ];

      function toggle(t, s) {
        return `
          <div style="padding:16px; border-radius:12px; background:#F8FAFC; border:1px solid rgba(15,23,42,0.08); display:flex; flex-direction:column; justify-content:space-between; gap:12px;">
            <div>
              <div style="font-size:14px; font-weight:600; color:#0F172A;">${t}</div>
              <div style="font-size:12px; color:#475569; margin-top:2px;">${s}</div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-family:'JetBrains Mono'; font-size:11px; font-weight:700; color:#059669;">[ENFORCED]</span>
              <div style="width:44px; height:24px; border-radius:12px; background:#10B981; padding:2px; display:flex; align-items:center; justify-content:flex-end;">
                <div style="width:20px; height:20px; border-radius:50%; background:#FFF;"></div>
              </div>
            </div>
          </div>
        `;
      }

      canvas.innerHTML = `
        <div class="scene-container" style="flex-direction:column; gap:24px;">
          <div style="width:860px; background:#FFFFFF; border-radius:20px; padding:28px; box-shadow:0 25px 50px -12px rgba(15,23,42,0.12); border:1px solid rgba(15,23,42,0.08); display:flex; flex-direction:column; gap:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:20px; font-weight:700; color:#0F172A;">Intent-Driven Archetype Engine</div>
                <div style="font-size:13px; color:#475569;">Never force dark Linear clones on every product. Match true brand DNA.</div>
              </div>
              <span class="badge badge-ok">7 Archetypes Live</span>
            </div>
            <div style="display:flex; background:#F1F5F9; padding:6px; border-radius:14px; gap:6px;">
              ${tabs.map((t, idx) => `
                <div style="flex:1; padding:12px 16px; border-radius:10px; background:${active === idx ? '#FFF' : 'transparent'}; border:${active === idx ? '1px solid rgba(15,23,42,0.08)' : '1px solid transparent'}; box-shadow:${active === idx ? '0 2px 8px rgba(15,23,42,0.08)' : 'none'};">
                  <div style="font-size:14px; font-weight:700; color:${active === idx ? '#0F172A' : '#475569'};">${t.name}</div>
                  <div style="font-family:'JetBrains Mono'; font-size:11px; color:${active === idx ? '#059669' : '#94A3B8'}; margin-top:2px;">${t.brand}</div>
                </div>
              `).join('')}
            </div>
          </div>
          <div style="width:860px; background:#FFFFFF; border-radius:20px; padding:24px; box-shadow:0 10px 30px -5px rgba(15,23,42,0.06); border:1px solid rgba(15,23,42,0.08); display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
            ${toggle('Zero AI-Slop Filter', 'Blocks purple neon glows')}
            ${toggle('Humanizer-Pro Copy', 'Strict verifiable facts')}
            ${toggle('Optical Typography', 'Cyrillic + Latin verified')}
          </div>
        </div>
      `;
    }

    // SCENE 6: STUDIO DISPLAY
    function renderScene6(f) {
      const sc = 0.94 + (f / 115) * 0.14;
      const wave = Math.sin(f / 6) * 10;
      const pathD = `M 0 120 Q 120 ${80 + wave} 240 110 T 480 ${70 - wave} T 720 90 L 720 180 L 0 180 Z`;
      const lineD = `M 0 120 Q 120 ${80 + wave} 240 110 T 480 ${70 - wave} T 720 90`;

      canvas.innerHTML = `
        <div class="scene-container">
          <div style="transform:scale(${sc}); display:flex; flex-direction:column; align-items:center;">
            <!-- Monitor Head -->
            <div style="width:1160px; height:690px; background:#0F172A; border-radius:20px; padding:12px; box-shadow:0 35px 80px -20px rgba(15,23,42,0.22); position:relative; display:flex; flex-direction:column;">
              <div style="flex:1; background:#F8FAFC; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; position:relative;">
                <div style="height:44px; background:#FFF; border-bottom:1px solid rgba(15,23,42,0.08); display:flex; align-items:center; justify-content:space-between; padding:0 20px;">
                  <div style="display:flex; gap:8px;">
                    <div style="width:10px; height:10px; border-radius:50%; background:#CBD5E1;"></div>
                    <div style="width:10px; height:10px; border-radius:50%; background:#CBD5E1;"></div>
                    <div style="width:10px; height:10px; border-radius:50%; background:#CBD5E1;"></div>
                  </div>
                  <div style="font-family:'JetBrains Mono'; font-size:12px; background:#F1F5F9; padding:4px 18px; border-radius:6px; color:#475569;">
                    https://welvar-taste-craft.system/benchmarks
                  </div>
                  <span class="badge badge-ok">Verified v9.0</span>
                </div>
                <!-- Modal in screen -->
                <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px;">
                  <div style="width:780px; background:#FFF; border-radius:18px; padding:28px; box-shadow:0 25px 50px -12px rgba(15,23,42,0.18); border:1px solid rgba(15,23,42,0.08); display:flex; flex-direction:column; gap:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <div>
                        <div style="font-size:18px; font-weight:700; color:#0F172A;">105 Real-World Benchmarks Telemetry</div>
                        <div style="font-size:12px; color:#475569;">Automated design audit across 7 global archetypes</div>
                      </div>
                      <span class="badge badge-ok">Audit: Perfect [OK]</span>
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;">
                      <div style="background:#F8FAFC; padding:12px; border-radius:10px; border:1px solid rgba(15,23,42,0.08);">
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#94A3B8;">BENCHMARKS</div>
                        <div style="font-size:18px; font-weight:700;">105 Brands</div>
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#2563EB; font-weight:600;">+15 Added</div>
                      </div>
                      <div style="background:#F8FAFC; padding:12px; border-radius:10px; border:1px solid rgba(15,23,42,0.08);">
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#94A3B8;">CRAFT SCORE</div>
                        <div style="font-size:18px; font-weight:700;">99.8%</div>
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#059669; font-weight:600;">Staff Senior</div>
                      </div>
                      <div style="background:#F8FAFC; padding:12px; border-radius:10px; border:1px solid rgba(15,23,42,0.08);">
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#94A3B8;">CONTRAST</div>
                        <div style="font-size:18px; font-weight:700;">7.4 : 1</div>
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#2563EB; font-weight:600;">WCAG AAA</div>
                      </div>
                      <div style="background:#F8FAFC; padding:12px; border-radius:10px; border:1px solid rgba(15,23,42,0.08);">
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#94A3B8;">AI-SLOP</div>
                        <div style="font-size:18px; font-weight:700; color:#DC2626;">0.0%</div>
                        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#059669; font-weight:600;">Eradicated</div>
                      </div>
                    </div>
                    <!-- Chart -->
                    <div style="background:#F8FAFC; border-radius:12px; border:1px solid rgba(15,23,42,0.08); padding:16px 20px;">
                      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span style="font-family:'JetBrains Mono'; font-size:12px; color:#475569; font-weight:600;">DESIGN INTENT OVER TIME</span>
                        <span style="font-family:'JetBrains Mono'; font-size:12px; color:#059669; font-weight:700;">94 BPM SYNC</span>
                      </div>
                      <svg width="100%" height="90" viewBox="0 0 720 180" preserveAspectRatio="none">
                        <defs>
                          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></linearGradient>
                        </defs>
                        <path d="${pathD}" fill="url(#g1)"/>
                        <path d="${lineD}" fill="none" stroke="#10B981" stroke-width="3"/>
                      </svg>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- Stand -->
            <div style="width:130px; height:90px; background:linear-gradient(180deg, #D4D4D8 0%, #A1A1AA 100%); clip-path:polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%); margin-top:-2px; z-index:-1;"></div>
            <div style="width:280px; height:12px; background:#E4E4E7; border-radius:4px 4px 6px 6px; border:1px solid #D4D4D8; margin-top:-4px;"></div>
          </div>
        </div>
      `;
    }

    // SCENE 7: OUTRO PUNCH
    function renderScene7(f) {
      const wordIdx = Math.floor(f / 19);
      if (f >= 84) {
        canvas.innerHTML = `
          <div class="scene-container" style="background:#090B0E; flex-direction:column; gap:16px;">
            <div style="width:56px; height:56px; border-radius:14px; background:#FFFFFF; color:#090B0E; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; box-shadow:0 0 40px rgba(255,255,255,0.2);">W</div>
            <div style="font-family:'Playfair Display',serif; font-size:78px; font-weight:700; color:#FFFFFF;">Welvar Taste Craft</div>
            <div style="font-size:22px; color:#94A3B8;">Human Senior Web Architecture Framework • 105 Benchmarks</div>
            <div style="margin-top:20px; padding:10px 24px; border-radius:30px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); display:flex; gap:12px; align-items:center;">
              <div style="width:8px; height:8px; border-radius:50%; background:#10B981;"></div>
              <span style="font-family:'JetBrains Mono'; font-size:15px; color:#E2E8F0;">github.com/Radomir-Aksenenko/ultimate-anti-ai-ui-slop</span>
            </div>
          </div>
        `;
        return;
      }

      let word = 'KILL';
      let color = '#0F172A';
      if (wordIdx === 1) { word = 'THE'; color = '#475569'; }
      else if (wordIdx === 2) { word = 'SLOP.'; color = '#DC2626'; }
      else if (wordIdx === 3) { word = 'BUILD'; color = '#0F172A'; }
      else if (wordIdx >= 4) { word = 'WITH TASTE.'; color = '#059669'; }

      canvas.innerHTML = `
        <div class="scene-container">
          <div style="font-size:140px; font-weight:900; color:${color}; letter-spacing:-0.05em;">${word}</div>
        </div>
      `;
    }

    // Initial render: check for ?frame=N in URL or start at 0
    const urlParams = new URLSearchParams(window.location.search);
    const initialFrame = urlParams.has('frame') ? parseInt(urlParams.get('frame'), 10) : (urlParams.has('time') ? Math.floor(parseFloat(urlParams.get('time')) * FPS) : 20);
    currentFrame = initialFrame;
    render(initialFrame);
  </script>
</body>
</html>
